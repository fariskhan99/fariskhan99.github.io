<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faris Khan | Computer Engineering & Systems</title>
  
  <!-- IBM Plex Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-body: #0d1117;
      --bg-card: #161b22;
      --bg-card-hover: #1c2128;
      --border-subtle: #30363d;
      --border-active: #58a6ff;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --text-accent: #58a6ff;
      --text-badge: #3fb950;
      --badge-bg: rgba(63, 185, 80, 0.1);
      --badge-border: rgba(63, 185, 80, 0.3);
      --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-code: 'IBM Plex Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Navigation */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 1rem 0;
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      font-family: var(--font-code);
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .brand-logo:hover {
      color: var(--text-accent);
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    .nav-links a:hover {
      color: var(--text-main);
    }

    /* Hero Section */
    .hero {
      padding: 5.5rem 0 4rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      font-family: var(--font-code);
      font-size: 0.8rem;
      color: var(--text-badge);
      background-color: var(--badge-bg);
      border: 1px solid var(--badge-border);
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 1.5rem;
    }

    .hero-title {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 1rem;
    }

    .hero-subtitle {
      font-size: 1.2rem;
      color: var(--text-muted);
      max-width: 650px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.65rem 1.25rem;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: var(--text-accent);
      color: #0d1117;
      border: 1px solid var(--text-accent);
    }

    .btn-primary:hover {
      background-color: #79b8ff;
      border-color: #79b8ff;
    }

    .btn-secondary {
      background-color: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
    }

    .btn-secondary:hover {
      background-color: var(--bg-card-hover);
      border-color: var(--text-muted);
    }

    .btn-ghost {
      color: var(--text-muted);
      padding: 0.65rem 0.75rem;
    }

    .btn-ghost:hover {
      color: var(--text-accent);
    }

    /* Sections */
    .section {
      padding: 4rem 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    .section-title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 2rem;
    }

    /* Skills Grid */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .skill-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 1.75rem 1.5rem;
      display: flex;
      flex-direction: column;
    }

    .skill-icon {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
    }

    .skill-card h3 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .skill-card p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
      flex-grow: 1;
    }

    .pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .pill {
      font-family: var(--font-code);
      font-size: 0.75rem;
      background-color: var(--bg-body);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }

    /* Projects Grid */
    .project-grid {
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }
